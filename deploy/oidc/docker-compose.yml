services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: mock-oidc
    restart: unless-stopped
    ports:
      - "8899:8080"
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/oidc.json
      LOG_LEVEL: INFO
    volumes:
      - ./oidc.json:/config/oidc.json:ro
