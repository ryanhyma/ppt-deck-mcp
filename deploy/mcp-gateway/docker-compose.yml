# LibreChat -> mcp-gateway (token broker) -> ppt-mcp.
#
# The gateway obtains a short-lived OAuth access token (client credentials) from the identity provider,
# injects it, refreshes it, and publishes no host port: reachable only from the LibreChat network. The
# MCP server runs with PPT_AUTH_MODE=entra (or token), so every request is validated.
#
# Same file works for the local Keycloak rehearsal and for Entra ID in production — only the four
# identity values change (TOKEN_URL, CLIENT_ID, CLIENT_SECRET, SCOPE/AUDIENCE).
services:
  mcp-gateway:
    build: .
    image: deck-mcp-gateway:1
    container_name: mcp-gateway
    restart: unless-stopped
    environment:
      MCP_UPSTREAM: ${MCP_UPSTREAM:-host.docker.internal:8931}
      TOKEN_URL: ${TOKEN_URL:?set TOKEN_URL (e.g. http://host.docker.internal:8898/realms/deck/protocol/openid-connect/token)}
      CLIENT_ID: ${CLIENT_ID:?set CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET:?set CLIENT_SECRET}
      SCOPE: ${SCOPE:-}
      AUDIENCE: ${AUDIENCE:-}
      TLS_VERIFY: ${TLS_VERIFY:-1}
      LISTEN_PORT: "8931"
      PPT_DEBUG: ${PPT_DEBUG:-0}
      # Only this network's members may use the gateway; keep it private to LibreChat + gateway.
      ALLOWED_CLIENTS: ${ALLOWED_CLIENTS:-172.16.0.0/12}
      GATEWAY_CLIENT_TOKEN: ${GATEWAY_CLIENT_TOKEN:-}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8388608}
      ALLOW_HTTP_IDP: ${ALLOW_HTTP_IDP:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mcp_gateway
    # no published ports on purpose: docker-network only

networks:
  # A dedicated network with only LibreChat and this gateway on it: other containers in the stack
  # (mongo, meilisearch, rag, vectordb) cannot reach the token-injecting proxy at all.
  mcp_gateway:
    name: mcp_gateway
    driver: bridge
