<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deck Studio</title>
<style>
  :root {
    --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --card: #ffffff; --bg: #f8fafc; --teal: #2a9d8f; --navy: #1f3864;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e5e7eb; --muted: #9ca3af; --line: #374151;
            --card: #111827; --bg: #0b1220; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Calibri, sans-serif; }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line);
           border-radius: 999px; padding: 2px 9px; }
  .empty { color: var(--muted); padding: 28px 6px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 820px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line);
           border-radius: 10px; overflow: hidden; cursor: zoom-in; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { font-size: 11px; color: var(--muted); padding: 6px 9px;
               border-top: 1px solid var(--line); }
  #lightbox { position: fixed; inset: 0; background: rgba(8, 12, 20, 0.86);
              display: none; align-items: center; justify-content: center; padding: 18px; z-index: 9; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; background: #fff; }
  .edit { position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 3px 8px;
          border-radius: 6px; border: 1px solid var(--line); background: var(--card);
          color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .12s; }
  figure { position: relative; }
  figure:hover .edit { opacity: 1; }
  .editor { margin-top: 10px; display: none; gap: 8px; }
  .editor.open { display: flex; }
  .editor input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--card); color: var(--ink); font: inherit; }
  .editor button { padding: 8px 12px; border-radius: 8px; border: 0; cursor: pointer;
                   background: var(--teal); color: #fff; font: inherit; font-weight: 600; }
  .editor button.ghost { background: transparent; color: var(--muted);
                         border: 1px solid var(--line); font-weight: 400; }
  .styles { margin-bottom: 14px; }
  .styles-head { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .styles-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .style-card { flex: 0 0 168px; padding: 0; border: 1px solid var(--line); border-radius: 9px;
                background: var(--card); cursor: pointer; overflow: hidden; text-align: left;
                color: var(--ink); font: inherit; }
  .style-card img { display: block; width: 100%; height: 94px; object-fit: cover; }
  .style-card span { display: block; font-size: 11px; padding: 5px 7px; color: var(--muted); }
  .style-card:hover { border-color: var(--teal); }
  .stylebtn { position: absolute; top: 8px; left: 8px; font-size: 11px; padding: 3px 8px;
              border-radius: 6px; border: 1px solid var(--line); background: var(--card);
              color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .12s; }
  figure:hover .stylebtn { opacity: 1; }
  .stylepanel { margin-top: 10px; display: none; grid-template-columns: repeat(3, minmax(0,1fr));
                gap: 8px; align-items: end; padding: 10px; border: 1px solid var(--line);
                border-radius: 10px; background: var(--card); }
  .stylepanel.open { display: grid; }
  .stylepanel label { font-size: 10px; color: var(--muted); display: block; margin-bottom: 3px; }
  .stylepanel input, .stylepanel select { width: 100%; padding: 5px 7px; border-radius: 6px;
                border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 12px; }
  .stylepanel .actions { grid-column: 1 / -1; display: flex; gap: 8px; }
  .stylepanel button { padding: 6px 12px; border-radius: 7px; border: 0; cursor: pointer;
                background: var(--teal); color: #fff; font: inherit; font-size: 12px; font-weight: 600; }
  .stylepanel button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 400; }
  .download { margin-left: 6px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line);
              background: var(--card); color: var(--teal); font: inherit; font-size: 11px; cursor: pointer; }
  #status { font-size: 11px; color: var(--teal); margin-top: 8px; min-height: 14px; }
  footer { margin-top: 14px; font-size: 11px; color: var(--muted); word-break: break-all; }
  footer code { color: var(--teal); }
</style>
</head>
<body>
  <header>
    <h1 id="title">Deck Studio</h1>
    <span class="badge" id="count">waiting for a tool result</span>
  </header>
  <div id="stage"><div class="empty">Build a deck (or call <code>preview_deck</code>) and its slides appear here.</div></div>
  <div class="stylepanel" id="stylepanel">
    <div><label for="si-title">Title pt</label><input id="si-title" type="number" min="8" max="72" placeholder="auto" /></div>
    <div><label for="si-body">Body pt</label><input id="si-body" type="number" min="8" max="72" placeholder="auto" /></div>
    <div><label for="si-font">Font</label><select id="si-font"><option value="">—</option>
      <option>Calibri</option><option>Georgia</option><option>Arial</option><option>Verdana</option>
      <option>Trebuchet MS</option><option>Times New Roman</option></select></div>
    <div><label for="si-tcolor">Title colour</label><input id="si-tcolor" placeholder="#1F3864" /></div>
    <div><label for="si-bcolor">Body colour</label><input id="si-bcolor" placeholder="#333333" /></div>
    <div><label for="si-align">Align</label><select id="si-align"><option value="">—</option>
      <option>left</option><option>center</option><option>right</option></select></div>
    <div class="actions">
      <button id="si-apply">Apply to slide</button>
      <button class="ghost" id="si-cancel">Cancel</button>
      <span id="si-target" style="font-size:11px;color:var(--muted);align-self:center"></span>
    </div>
  </div>
  <div class="editor" id="editor">
    <input id="edit-input" placeholder="What should change on this slide?" />
    <button id="edit-send">Ask agent</button>
    <button class="ghost" id="edit-cancel">Cancel</button>
  </div>
  <div id="status"></div>
  <footer id="foot"></footer>
  <div id="lightbox"><img alt="slide" /></div>

  <script type="module" src="__APP_JS__"></script>
</body>
</html>
